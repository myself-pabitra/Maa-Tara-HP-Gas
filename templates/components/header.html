{% load static %}
<header class="fixed inset-x-0 top-0 z-[60] flex h-[60px] items-center justify-between bg-white px-4 shadow-md sm:px-6">
    <div class="flex min-w-0 items-center gap-3 sm:gap-4">
        <button id="sidebarToggle"
                type="button"
                class="btn btn-ghost btn-square btn-sm lg:hidden"
                aria-controls="sidebarContainer"
                aria-expanded="false"
                aria-label="Open navigation">
            <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        <a href="{% url 'dashboard' %}" class="flex min-w-0 items-center gap-2 sm:gap-3" aria-label="Maa Tara HP Gas dashboard">
            <img src="{% static 'images/maa-tara-hp-gas-logo.png' %}"
                 alt="Maa Tara HP Gas logo"
                 class="h-10 w-10 shrink-0 object-contain sm:h-11 sm:w-11">
            <div class="min-w-0 leading-none">
                <h1 class="truncate text-lg font-black tracking-[0.12em] text-transparent bg-clip-text bg-gradient-to-r from-red-600 via-indigo-700 to-blue-700 sm:text-2xl">
                    MAA TARA
                </h1>
                <p class="mt-1 truncate text-[10px] font-bold tracking-[0.28em] text-amber-600 sm:text-xs">
                    HP GAS
                </p>
            </div>
        </a>
    </div>
</header>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const sidebar = document.getElementById("sidebarContainer");
    const toggle = document.getElementById("sidebarToggle");
    const backdrop = document.getElementById("sidebarBackdrop");
    const desktop = window.matchMedia("(min-width: 1024px)");

    if (!sidebar || !toggle || !backdrop) return;

    function setSidebar(open) {
        const isDesktop = desktop.matches;
        sidebar.classList.toggle("-translate-x-full", !open && !isDesktop);
        backdrop.classList.toggle("hidden", !open || isDesktop);
        document.body.classList.toggle("overflow-hidden", open && !isDesktop);
        toggle.setAttribute("aria-expanded", String(open && !isDesktop));
        toggle.setAttribute("aria-label", open ? "Close navigation" : "Open navigation");
    }

    toggle.addEventListener("click", function () {
        setSidebar(sidebar.classList.contains("-translate-x-full"));
    });
    backdrop.addEventListener("click", function () { setSidebar(false); });
    document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") setSidebar(false);
    });
    sidebar.addEventListener("click", function (event) {
        if (!desktop.matches && event.target.closest("a")) setSidebar(false);
    });
    desktop.addEventListener("change", function () { setSidebar(false); });
    setSidebar(false);
});
</script>
