{% extends 'layout.html' %}
{% load static %}

{% block title %}Edit DAC Entry{% endblock title %}

{% block content %}
<div class="p-6">
  <h2 class="text-3xl font-bold mb-6 text-primary">Edit DAC Entry</h2>
  <form method="post" class="bg-base-200 p-6 rounded-2xl shadow-lg max-w-2xl">
    {% csrf_token %}
    <div class="grid gap-5">
      <div class="form-control">
        <label class="label"><span class="label-text font-medium">Subdealer</span></label>
        <select name="subdealer_code" class="select select-bordered w-full" required>
          <option value="">Select a subdealer</option>
          {% for subdealer in subdealers %}
            <option value="{{ subdealer.subdealerCode }}" {% if entry.subdealer_id == subdealer.id %}selected{% endif %}>
              {{ subdealer.name }} ({{ subdealer.subdealerCode }})
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="form-control">
        <label class="label"><span class="label-text font-medium">DAC Date</span></label>
        <input type="date" name="dac_date" value="{{ entry.entry_date }} " class="input input-bordered w-full" required />
      </div>

      <div class="form-control">
        <label class="label"><span class="label-text font-medium">Quantity</span></label>
        <input type="number" step="0.01" min="0" name="amount" value="{{ entry.amount }}" class="input input-bordered w-full" required />
      </div>

      <div class="form-control">
        <!-- <label class="label"><span class="label-text font-medium">Description</span></label> -->
        <!-- <textarea name="description" class="textarea textarea-bordered w-full h-28">{{ entry.description }}</textarea> -->
      </div>

      <div class="flex gap-3 mt-4">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'view_dac' %}" class="btn btn-ghost">Cancel</a>
      </div>
    </div>
  </form>
</div>
{% endblock content %}
