{% extends 'layout.html' %}
{% load static %}

{% block title %}Edit Subdealer{% endblock title %}

{% block content %}
<div class="flex justify-center mt-8">
  <form method="post" class="w-full max-w-lg bg-base-200 p-8 rounded-2xl shadow-xl space-y-6">
    {% csrf_token %}
    <h2 class="text-2xl font-semibold text-center mb-6 text-primary">Edit Subdealer</h2>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Subdealer Code</span>
      </label>
      <input type="text" value="{{ subdealer.subdealerCode }}" class="input input-bordered w-full focus:outline-none bg-gray-100" readonly />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Subdealer Name</span>
      </label>
      <input type="text" name="name" value="{{ subdealer.name }}" placeholder="Subdealer name"
        class="input input-bordered w-full focus:outline-none" required />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Phone Number</span>
      </label>
      <input type="text" name="phone_number" value="{{ subdealer.phone_number }}" placeholder="Phone number"
        class="input input-bordered w-full focus:outline-none" required />
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">Address</span>
      </label>
      <textarea name="address" placeholder="Address"
        class="textarea textarea-bordered w-full h-28 focus:outline-none" required>{{ subdealer.address }}</textarea>
    </div>

    <div class="form-control">
      <label class="label">
        <span class="label-text font-medium">DAC Percentage</span>
      </label>
      <input type="number" name="dac_percentage" value="{{ subdealer.dac_percentage }}" min="0" max="100" step="0.01"
        class="input input-bordered w-full focus:outline-none" required />
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:justify-between">
      <a href="{% url 'view_subdealers' %}" class="btn btn-ghost w-full sm:w-auto">Cancel</a>
      <button type="submit" class="btn btn-primary w-full sm:w-auto">Save Changes</button>
    </div>
  </form>
</div>
{% endblock content %}
